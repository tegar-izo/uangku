<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#415f91" />
        
        <title>Uangku - Money Manager</title>

        <link rel="stylesheet" href="theme.css" id="theme-link" />
        <link rel="stylesheet" href="style.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
            rel="stylesheet"
        />

        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />

        <style>
            .material-symbols-rounded {
                font-variation-settings:
                    "FILL" 1,
                    "wght" 700,
                    "GRAD" 0,
                    "opsz" 40;
            }
        </style>
        <script
            src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"
            defer
        ></script>
    </head>
    <body>
        <input
            type="file"
            id="file-input-hidden"
            accept=".json"
            style="display: none"
        />

        <div class="popup-overlay" id="popup-overlay" style="display: none">
            <div
                class="modal"
                id="modal-content"
                role="dialog"
                aria-modal="true"
                aria-labelledby="modal-header"
            >
                <div class="modal-grabber"></div>
                <div class="modal-header" id="modal-header">
                    masukkan pemasukan
                </div>
                <label class="modal-label" for="input-desc">Keterangan</label>
                <input
                    type="text"
                    id="input-desc"
                    placeholder="misal: Beli es"
                />
                <label class="modal-label" for="input-value">Jumlah</label>
                <input
                    type="text"
                    inputmode="numeric"
                    autocomplete="off"
                    id="input-value"
                    placeholder="0"
                />
                <button id="save-value">simpan</button>
            </div>
        </div>

        <div class="popup-overlay" id="wallet-overlay" style="display: none">
            <div
                class="modal"
                id="wallet-modal"
                role="dialog"
                aria-modal="true"
                aria-labelledby="wallet-modal-header"
            >
                <div class="modal-grabber"></div>
                <div class="modal-header" id="wallet-modal-header">
                    Tambah Dompet Baru
                </div>
                <label class="modal-label" for="input-wallet-name"
                    >Nama dompet</label
                >
                <input
                    type="text"
                    id="input-wallet-name"
                    placeholder="misal: BCA, Tunai"
                    maxlength="24"
                />
                <button id="save-wallet">simpan</button>
            </div>
        </div>

        <div class="popup-overlay" id="delete-wallet-overlay" style="display: none">
            <div
                class="modal"
                id="delete-wallet-modal"
                role="dialog"
                aria-modal="true"
                aria-labelledby="delete-wallet-title"
            >
                <div class="modal-grabber"></div>
                <div class="modal-header" id="delete-wallet-title">
                    Hapus Dompet
                </div>
                <p class="modal-text" id="delete-wallet-info"></p>
                <label
                    class="modal-label"
                    id="move-wallet-label"
                    for="move-wallet-target"
                    >Pindahkan transaksi ke</label
                >
                <select id="move-wallet-target"></select>
                <div class="modal-actions">
                    <button
                        class="modal-button secondary"
                        id="cancel-delete-wallet"
                    >
                        batal
                    </button>
                    <button class="modal-button danger" id="confirm-delete-wallet">
                        hapus
                    </button>
                </div>
            </div>
        </div>

        <div class="popup-overlay" id="transfer-overlay" style="display: none">
            <div
                class="modal"
                id="transfer-modal"
                role="dialog"
                aria-modal="true"
                aria-labelledby="transfer-title"
            >
                <div class="modal-grabber"></div>
                <div class="modal-header" id="transfer-title">
                    Transfer Antar Dompet
                </div>
                <div class="transfer-row">
                    <div class="transfer-field">
                        <label class="modal-label" for="transfer-from"
                            >Dari dompet</label
                        >
                        <select id="transfer-from"></select>
                    </div>
                    <button
                        type="button"
                        class="transfer-arrow"
                        id="swap-transfer"
                        aria-label="Tukar dompet asal dan tujuan"
                    >
                        <span class="material-symbols-rounded" aria-hidden="true"
                            >swap_horiz</span
                        >
                    </button>
                    <div class="transfer-field">
                        <label class="modal-label" for="transfer-to"
                            >Ke dompet</label
                        >
                        <select id="transfer-to"></select>
                    </div>
                </div>
                <label class="modal-label" for="transfer-amount">Jumlah</label>
                <input
                    type="text"
                    inputmode="numeric"
                    autocomplete="off"
                    id="transfer-amount"
                    placeholder="0"
                />
                <label class="modal-label" for="transfer-note"
                    >Catatan (opsional)</label
                >
                <input
                    type="text"
                    id="transfer-note"
                    placeholder="misal: nabung bulan ini"
                    maxlength="40"
                />
                <button id="save-transfer">transfer</button>
            </div>
        </div>

        <div class="popup-overlay" id="filter-overlay" style="display: none">
            <div
                class="modal"
                id="filter-modal"
                role="dialog"
                aria-modal="true"
                aria-labelledby="filter-title"
            >
                <div class="modal-grabber"></div>
                <div class="modal-header" id="filter-title">Filter Riwayat</div>
                <label class="modal-label" for="filter-wallet">Dompet</label>
                <select id="filter-wallet"></select>
                <label class="modal-label" for="filter-date">Tanggal</label>
                <select id="filter-date"></select>
                <div class="modal-actions">
                    <button class="modal-button secondary" id="reset-filter">
                        reset
                    </button>
                    <button class="modal-button primary" id="apply-filter">
                        terapkan
                    </button>
                </div>
            </div>
        </div>

        <div class="menu-overlay" id="menu-overlay" style="display: none">
            <div
                class="menu-window"
                role="dialog"
                aria-modal="true"
                aria-labelledby="menu-title"
            >
                <div class="menu-title" id="menu-title">Pengaturan</div>
                <button class="menu-button export">
                    <span class="material-symbols-rounded" aria-hidden="true">upload</span>
                    <span class="menu-label">export data</span>
                </button>
                <button class="menu-button import">
                    <span class="material-symbols-rounded" aria-hidden="true">download</span>
                    <span class="menu-label">import data</span>
                </button>
                <button class="menu-button add-wallet" id="add-wallet">
                    <span class="material-symbols-rounded" aria-hidden="true"
                        >account_balance_wallet</span
                    >
                    <span class="menu-label">tambah dompet</span>
                </button>
                <button class="menu-button rename-wallet" id="rename-wallet">
                    <span class="material-symbols-rounded" aria-hidden="true">edit</span>
                    <span class="menu-label">ganti nama dompet</span>
                </button>
                <button class="menu-button transfer" id="transfer">
                    <span class="material-symbols-rounded" aria-hidden="true">swap_horiz</span>
                    <span class="menu-label">transfer saldo</span>
                </button>
                <button class="menu-button theme" id="theme-toggle">
                    <span class="material-symbols-rounded" aria-hidden="true" id="theme-icon"
                        >dark_mode</span
                    >
                    <span class="menu-label" id="theme-text">tema</span>
                </button>
                <button
                    class="menu-button delete-wallet"
                    id="delete-wallet"
                >
                    <span class="material-symbols-rounded" aria-hidden="true">delete</span>
                    <span class="menu-label">hapus dompet</span>
                </button>
                <button class="menu-button delete-all" id="delete-all">
                    <span class="material-symbols-rounded" aria-hidden="true">delete_forever</span>
                    <span class="menu-label">hapus semua data</span>
                </button>
            </div>
        </div>

        <div class="app">
            <header class="container top">
                <div class="header">
                    <div class="welcome-text">
                        <h1>Uangku</h1>
                        <p class="subtitle">Kelola keuanganmu dengan rapi</p>
                    </div>
                    <button
                        class="button"
                        id="setting"
                        aria-label="Buka pengaturan"
                    >
                        <span class="material-symbols-rounded" aria-hidden="true">menu</span>
                    </button>
                </div>

                <div class="saldo">
                    <div class="saldo-header">
                        <div class="group">
                            <span class="material-symbols-rounded" aria-hidden="true"
                                >account_balance_wallet</span
                            >
                            <p>Saldo · semua dompet</p>
                        </div>
                    </div>
                    <span id="sisa-saldo">Rp 0</span>
                    <div class="cashflow">
                        <div class="flow flow-in">
                            <span class="material-symbols-rounded" aria-hidden="true"
                                >arrow_circle_down</span
                            >
                            <span id="flow-in">Rp 0</span>
                        </div>
                        <div class="flow flow-out">
                            <span class="material-symbols-rounded" aria-hidden="true"
                                >arrow_circle_up</span
                            >
                            <span id="flow-out">Rp 0</span>
                        </div>
                    </div>
                </div>

                <div class="wallet-row">
                    <div class="wallet-strip" id="wallet-strip"></div>
                    <button
                        class="wallet-add"
                        id="wallet-add"
                        aria-label="Tambah dompet"
                    >
                        <span class="material-symbols-rounded" aria-hidden="true">add</span>
                    </button>
                </div>
            </header>

            <nav class="container mid">
                <button class="action-button" id="keluar">
                    <span class="material-symbols-rounded" aria-hidden="true"
                        >arrow_circle_up</span
                    >
                    <span class="action-label">keluar</span>
                </button>

                <button class="action-button" id="masuk">
                    <span class="material-symbols-rounded" aria-hidden="true"
                        >arrow_circle_down</span
                    >
                    <span class="action-label">masuk</span>
                </button>

                <button
                    class="action-button"
                    id="transfer-quick"
                    aria-label="Transfer antar dompet"
                >
                    <span class="material-symbols-rounded" aria-hidden="true">swap_horiz</span>
                    <span class="action-label">transfer</span>
                </button>
            </nav>

            <main class="container bottom">
                <div class="history">
                    <div class="history-header">
                        <h2>Riwayat Transaksi</h2>
                        <button
                            class="filter-button"
                            id="open-filter"
                            aria-haspopup="dialog"
                            aria-controls="filter-modal"
                        >
                            <span class="material-symbols-rounded" aria-hidden="true"
                                >filter_list</span
                            >
                            <span id="filter-label">semua</span>
                        </button>
                    </div>

                    <div class="history-content" id="history-list"></div>
                </div>
            </main>
        </div>
        <script src="script.js" defer></script>
    </body>
</html>
