<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#415f91" />
        
        <title>Uangku - Money Manager</title>

        <link rel="stylesheet" href="theme.css" id="theme-link" />
        <link rel="stylesheet" href="style.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
            rel="stylesheet"
        />

        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />

        <style>
            .material-symbols-rounded {
                font-variation-settings:
                    "FILL" 1,
                    "wght" 700,
                    "GRAD" 0,
                    "opsz" 40;
            }
        </style>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    </head>
    <body>
        <input
            type="file"
            id="file-input-hidden"
            accept=".json"
            style="display: none"
        />

        <div class="popup-overlay" id="popup-overlay" style="display: none">
            <div class="modal" id="modal-content">
                <div class="modal-grabber"></div>
                <div class="modal-header" id="modal-header">
                    masukkan pemasukan
                </div>
                <input
                    type="text"
                    id="input-desc"
                    placeholder="Keterangan (misal: Beli Es)"
                    aria-label="Keterangan transaksi"
                />
                <input
                    type="text"
                    inputmode="numeric"
                    autocomplete="off"
                    id="input-value"
                    placeholder="Jumlah (Rp)"
                    aria-label="Jumlah transaksi"
                />
                <button id="save-value">simpan</button>
            </div>
        </div>

        <div class="popup-overlay" id="wallet-overlay" style="display: none">
            <div class="modal" id="wallet-modal">
                <div class="modal-grabber"></div>
                <div class="modal-header" id="wallet-modal-header">
                    Tambah Dompet Baru
                </div>
                <input
                    type="text"
                    id="input-wallet-name"
                    placeholder="Nama dompet (misal: BCA, Tunai)"
                    maxlength="24"
                />
                <button id="save-wallet">simpan</button>
            </div>
        </div>

        <div class="popup-overlay" id="delete-wallet-overlay" style="display: none">
            <div class="modal" id="delete-wallet-modal">
                <div class="modal-grabber"></div>
                <div class="modal-header">Hapus Dompet</div>
                <p class="modal-text" id="delete-wallet-info"></p>
                <label
                    class="modal-label"
                    id="move-wallet-label"
                    for="move-wallet-target"
                    >Pindahkan transaksi ke</label
                >
                <select id="move-wallet-target"></select>
                <div class="modal-actions">
                    <button
                        class="modal-button secondary"
                        id="cancel-delete-wallet"
                    >
                        batal
                    </button>
                    <button class="modal-button danger" id="confirm-delete-wallet">
                        hapus
                    </button>
                </div>
            </div>
        </div>

        <div class="popup-overlay" id="transfer-overlay" style="display: none">
            <div class="modal" id="transfer-modal">
                <div class="modal-grabber"></div>
                <div class="modal-header">Transfer Antar Dompet</div>
                <div class="transfer-row">
                    <select id="transfer-from" aria-label="Dompet sumber"></select>
                    <button
                        type="button"
                        class="transfer-arrow"
                        id="swap-transfer"
                        aria-label="Tukar dompet asal dan tujuan"
                    >
                        <span class="material-symbols-rounded">swap_horiz</span>
                    </button>
                    <select id="transfer-to" aria-label="Dompet tujuan"></select>
                </div>
                <input
                    type="text"
                    inputmode="numeric"
                    autocomplete="off"
                    id="transfer-amount"
                    placeholder="Jumlah (Rp)"
                    aria-label="Jumlah transfer"
                />
                <input
                    type="text"
                    id="transfer-note"
                    placeholder="Catatan (opsional)"
                    maxlength="40"
                />
                <button id="save-transfer">transfer</button>
            </div>
        </div>

        <div class="popup-overlay" id="filter-overlay" style="display: none">
            <div class="modal" id="filter-modal">
                <div class="modal-grabber"></div>
                <div class="modal-header">Filter Riwayat</div>
                <label class="modal-label" for="filter-wallet">Dompet</label>
                <select id="filter-wallet"></select>
                <label class="modal-label" for="filter-date">Tanggal</label>
                <select id="filter-date"></select>
                <div class="modal-actions">
                    <button class="modal-button secondary" id="reset-filter">
                        reset
                    </button>
                    <button class="modal-button primary" id="apply-filter">
                        terapkan
                    </button>
                </div>
            </div>
        </div>

        <div class="menu-overlay" id="menu-overlay" style="display: none">
            <div class="menu-window">
                <div class="menu-title">Pengaturan</div>
                <button class="menu-button export">
                    <span class="material-symbols-rounded">upload</span>
                    <p>export data</p>
                </button>
                <button class="menu-button import">
                    <span class="material-symbols-rounded">download</span>
                    <p>import data</p>
                </button>
                <button class="menu-button add-wallet" id="add-wallet">
                    <span class="material-symbols-rounded"
                        >account_balance_wallet</span
                    >
                    <p>tambah dompet</p>
                </button>
                <button class="menu-button rename-wallet" id="rename-wallet">
                    <span class="material-symbols-rounded">edit</span>
                    <p>ganti nama dompet</p>
                </button>
                <button class="menu-button transfer" id="transfer">
                    <span class="material-symbols-rounded">swap_horiz</span>
                    <p>transfer saldo</p>
                </button>
                <button class="menu-button theme" id="theme-toggle">
                    <span class="material-symbols-rounded" id="theme-icon"
                        >dark_mode</span
                    >
                    <p id="theme-text">tema</p>
                </button>
                <button
                    class="menu-button delete-wallet"
                    id="delete-wallet"
                >
                    <span class="material-symbols-rounded">delete</span>
                    <p>hapus dompet</p>
                </button>
                <button class="menu-button delete-all" id="delete-all">
                    <span class="material-symbols-rounded">delete_forever</span>
                    <p>hapus semua data</p>
                </button>
            </div>
        </div>

        <div class="app">
            <header class="container top">
                <div class="header">
                    <div class="welcome-text">
                        <h3>Uangku</h3>
                        <p class="subtitle">Kelola keuanganmu dengan rapi</p>
                    </div>
                    <button
                        class="button"
                        id="setting"
                        aria-label="Buka pengaturan"
                    >
                        <span class="material-symbols-rounded">menu</span>
                    </button>
                </div>

                <div class="saldo">
                    <div class="saldo-header">
                        <div class="group">
                            <span class="material-symbols-rounded"
                                >account_balance_wallet</span
                            >
                            <p>Saldo · semua dompet</p>
                        </div>
                    </div>
                    <span id="sisa-saldo">Rp 0</span>
                    <div class="cashflow">
                        <div class="flow flow-in">
                            <span class="material-symbols-rounded"
                                >arrow_circle_down</span
                            >
                            <span id="flow-in">Rp 0</span>
                        </div>
                        <div class="flow flow-out">
                            <span class="material-symbols-rounded"
                                >arrow_circle_up</span
                            >
                            <span id="flow-out">Rp 0</span>
                        </div>
                    </div>
                </div>

                <div class="wallet-row">
                    <div class="wallet-strip" id="wallet-strip"></div>
                    <button
                        class="wallet-add"
                        id="wallet-add"
                        aria-label="Tambah dompet"
                    >
                        <span class="material-symbols-rounded">add</span>
                    </button>
                </div>
            </header>

            <nav class="container mid">
                <button class="action-button" id="keluar">
                    <span class="material-symbols-rounded"
                        >arrow_circle_up</span
                    >
                    <p>keluar</p>
                </button>

                <button class="action-button" id="masuk">
                    <span class="material-symbols-rounded"
                        >arrow_circle_down</span
                    >
                    <p>masuk</p>
                </button>

                <button
                    class="action-button"
                    id="transfer-quick"
                    aria-label="Transfer antar dompet"
                >
                    <span class="material-symbols-rounded">swap_horiz</span>
                    <p>transfer</p>
                </button>
            </nav>

            <main class="container bottom">
                <div class="history">
                    <div class="history-header">
                        <h3>Riwayat Transaksi</h3>
                        <button class="filter-button" id="open-filter">
                            <span class="material-symbols-rounded"
                                >filter_list</span
                            >
                            <span id="filter-label">semua</span>
                        </button>
                    </div>

                    <div class="history-content" id="history-list"></div>
                </div>
            </main>
        </div>
        <script src="script.js"></script>
    </body>
</html>
